<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Иконки: .ico для Яндекса и старых браузеров, .svg для современных -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Мариинский районный дом культуры</title>
    <meta
      name="description"
      content="Официальный сайт Мариинского районного Дома культуры: афиша и фотоотчёты мероприятий, клубы и кружки, планы работы, документы, контакты."
    />
    <meta name="yandex-verification" content="4a0016a2da93e5c0" />

    <!-- Open Graph — превью ссылок в соцсетях и мессенджерах -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Мариинский районный дом культуры" />
    <meta property="og:title" content="Мариинский районный дом культуры" />
    <meta
      property="og:description"
      content="Афиша и фотоотчёты мероприятий, клубы и кружки, планы работы, документы, контакты."
    />
    <!-- %SITE_ORIGIN% подставляется на сборке из siteMeta.ts (vite.config: injectSiteOrigin) -->
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <!-- og:image обязан быть растровым (PNG/JPG) и крупным: SVG соцсети отвергают.
         Размеры указываем явно — скрейперы тогда не докачивают файл для проверки. -->
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# HTTP :80 — только ACME-проверка и редирект на HTTPS
server {
    listen 80;
    server_name nn-lance.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 — основной сервер
server {
    listen 443 ssl;
    http2 on;
    server_name nn-lance.ru;
    server_tokens off;
    # Нужен из-за переменной в proxy_pass (см. location /api/): с переменной nginx
    # резолвит имя в рантайме, а не при старте. Побочный плюс — nginx поднимается,
    # даже если контейнер backend лежит (иначе «host not found in upstream» на старте).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Сертификат Let's Encrypt. Автопродление делает контейнер certbot (`renew` раз
    # в 12 ч), но ПЕРВЫЙ выпуск — руками, иначе nginx не стартует («cannot load
    # certificate ... No such file or directory») и уходит в цикл перезапусков.
    # Условия: домен указывает A-записью на публичный IP, порты 80/443 открыты.
    #   docker compose up -d nginx   # временно закомментировав эти две строки и listen 443
    #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d nn-lance.ru
    #   # вернуть строки обратно, затем docker compose restart nginx
    # После включения HTTPS: CLIENT_ORIGIN=https://<домен> в корневом .env и
    # `docker compose up -d backend` (пересоздать, не restart). Без HTTPS не работает
    # вход в админку — auth-кука идёт с флагом Secure.
    ssl_certificate     /etc/letsencrypt/live/nn-lance.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nn-lance.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ⚠️ Префикс /api срезается ИМЕННО rewrite'ом, и «упрощать» это нельзя.
    # Привычная форма `proxy_pass http://backend:3001/;` (с хвостовым слэшем) режет
    # префикс только когда адрес записан литералом. Здесь адрес — переменная (нужна
    # ради ленивого резолвинга, см. resolver выше), а с переменной хвостовой слэш
    # префикс НЕ срезает: бэкенд начнёт получать /api/events вместо /events и весь
    # API ответит 404. Сломается тихо — сборка и тесты этого не видят, `restart nginx`
    # пройдёт успешно.
    location /api/ {
        set $backend_upstream http://backend:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 210M;
        proxy_request_buffering off;
    }

    location /health {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # sitemap.xml отдаёт бэкенд (статический XML: только разделы сайта, без /events/:id).
    location = /sitemap.xml {
        set $backend_upstream http://backend:3001;
        rewrite ^ /sitemap.xml break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Слэш-дубли: /events/ → 301 /events (+query). Иначе оба варианта отдают
    # одинаковый 200, и поисковики индексируют их как разные страницы, деля
    # сигналы ранжирования. Корень / не матчится; /api/ исключён (301 ломает
    # POST), /uploads/ — чтобы не зацепить каталоги загрузок.
    location ~ ^/(?!api/|uploads/)(.+)/$ {
        return 301 /$1$is_args$args;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        # Имена загрузок генерируются (timestamp_random) и не переиспользуются:
        # содержимое по конкретному URL не меняется никогда — кэшируем надолго.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # nosniff важен на пользовательских загрузках; остальные — для единообразия.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    # Бандлы Vite: в имени файла хэш содержимого, любое изменение меняет URL —
    # кэшируем «навсегда», деплой инвалидирует сам себя сменой имени.
    location /assets/ {
        root /var/www/dist;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    # Крупная нехэшированная статика (видео, шрифты) меняется редко: неделя кэша,
    # при замене файла посетители увидят новую версию максимум через 7 дней.
    location ~ ^/(video|fonts)/ {
        root /var/www/dist;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    location / {
        root /var/www/dist;
        # $uri/index.html — отдаёт пререндер статических маршрутов (dist/events/index.html и т.д.);
        # иначе SPA-фолбэк на /index.html (динамические /events/:id и пр.).
        try_files $uri $uri/index.html /index.html;
        # no-cache = «кэшируй, но перепроверяй» (304, пока файл не изменился).
        # Критично для index.html: закэшированный жёстко, после деплоя он ссылается
        # на уже удалённые хэши /assets/ → белый экран до Ctrl+F5. Мелкой статике
        # в корне (favicon, og-image, robots) ревалидация тоже подходит.
        add_header Cache-Control "no-cache" always;
        # add_header НЕ наследуется в блок, где есть свой add_header (тут — CSP),
        # поэтому заголовки безопасности дублируются здесь и в location /uploads/.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # Карта переехала с 2ГИС на iframe Яндекс.Конструктора, и политика от этого
        # заметно похудела: тайлы грузит документ ВНУТРИ фрейма, на него наша CSP не
        # распространяется, поэтому тайловые хосты в img-src/connect-src не нужны —
        # достаточно frame-src https://yandex.ru.
        # Вместе с 2ГИС ушёл и 'unsafe-eval' в script-src: он стоял здесь только ради
        # их Raster JS API. Если после выката отвалится Яндекс.Метрика — значит eval
        # нужен был и ей, вернуть в script-src (и синхронно в helmet, app.ts).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; font-src 'self' data:; script-src 'self' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://yandex.ru; frame-src https://yandex.ru https://mc.yandex.ru https://mc.yandex.com" always;
    }
}